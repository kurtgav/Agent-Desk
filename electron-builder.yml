# Windows installer, per ADR-0012: NSIS, one click, per user, no admin, unsigned in v1. macOS: a dmg and a zip per arch.
# Build with `npm run pack` (unpacked folder), `npm run dist` (Windows installer) or `npm run dist:mac` (on a Mac).
# Output goes to release/.
appId: com.thirdcode.agentdeck
productName: AgentDeck
copyright: Copyright (c) 2026 Kurt Gavin
directories:
  output: release
  buildResources: build
# electron-vite writes the app to out/; resources/ holds the icons the main process loads at run time.
files:
  - out/**
  - resources/**
# The installer must carry the licences of what it bundles (MIT notices, the Inter font's OFL).
# THIRD_PARTY_NOTICES.md is generated by `node scripts/make-notices.mjs`; rerun it when dependencies change.
extraResources:
  - from: LICENSE
    to: LICENSE
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
# Every dependency is a devDependency that electron-vite bundles, and the database is node:sqlite (built into
# Electron's Node), so there is nothing to rebuild and no native module to unpack from the asar.
npmRebuild: false
# Never publish from a build; the release workflow uploads the installer itself.
publish: null
win:
  target:
    - target: nsis
      arch: x64
  # electron-builder turns this 256x256 PNG into a multi-size .ico (NSIS needs at least 256x256).
  icon: resources/icon.png
  # No code-signing certificate in v1 (ADR-0012), so Windows SmartScreen warns on first run.
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AgentDeck
  artifactName: AgentDeck-Setup-${version}.exe
  # Adds the customUnInstall macro that removes AgentDeck's hook entries from settings.json.
  include: build/installer.nsh
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  # 1024x1024 with Apple's margin; electron-builder makes the .icns from it.
  icon: build/icon-mac.png
  # No Developer ID in v1 (ADR-0012): no notarization, no hardened runtime. "-" is an ad-hoc signature, not a
  # certificate; with none at all, Gatekeeper calls a downloaded Apple-silicon build "damaged" instead of offering Open.
  identity: '-'
  hardenedRuntime: false
  # No LSUIElement: the Dock icon stays, carries the badge and reopens the window. Terminal and iTerm are driven with
  # osascript, and macOS refuses Apple events from an app whose Info.plist does not say why it sends them.
  extendInfo:
    NSAppleEventsUsageDescription: AgentDeck opens Terminal or iTerm to run Claude Code in a folder you chose.
  artifactName: AgentDeck-${version}-${arch}.${ext}
dmg:
  # The app and an Applications link, to drag one onto the other.
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
